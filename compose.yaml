services:
  af-bridge:
    build: .
    image: af-bridge:local
    container_name: af-bridge
    restart: unless-stopped
    environment:
      AF_HA_URL: ${AF_HA_URL}
      AF_HA_TOKEN: ${AF_HA_TOKEN}
      AF_INTERVAL: ${AF_INTERVAL:-300}
      AF_CLUBS: ${AF_CLUBS:-}
    volumes:
      # AF-login (.af_token.json) blijft hier bewaard
      - /var/docker/af-bridge:/root
